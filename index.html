<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ink Blade</title>
<meta name="theme-color" content="#e8eef0">
<meta name="description" content="A one-thumb dash brawler with 10 fighters, bosses, mazes and daily challenges.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}html,body{overscroll-behavior:none}</style>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Sans+Condensed:wght@400;600;700&display=swap">
<style>
/* Layout: one bordered paper arena fills the phone; score strip rides above it; menus and cards slide over the frozen arena */
:root{
  --paper:#e8eef0; --sheet:#f6f9fa; --ink:#191b24; --ink2:#4a5164; --cobalt:#2346ff; --hot:#ff6a2b; --steel:#8a93a6; --gold:#c98a00;
  --display:'Dela Gothic One', Impact, 'Arial Black', sans-serif;
  --body:'IBM Plex Sans Condensed', 'Arial Narrow', system-ui, sans-serif;
  color-scheme: light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0}
canvas{position:absolute;inset:0;display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
#hud{position:absolute;top:0;left:0;right:0;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.hrow{display:flex;align-items:center;gap:12px}
.hearts{display:flex;gap:4px;min-width:60px;flex-wrap:wrap;max-width:110px}
.hearts i{width:15px;height:15px;border-radius:50%;background:var(--pc,var(--cobalt));border:2px solid var(--ink)}
.hearts i.off{background:transparent;border-color:var(--steel)}
.mid{flex:1;min-width:0;text-align:center}
#score{font-family:var(--display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
#wave{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pauseBtn{pointer-events:auto;width:38px;height:38px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);font-weight:700;font-size:12px}
#rival{margin-top:6px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;border:2px solid var(--ink);border-radius:10px;padding:3px 10px;background:var(--sheet);font-variant-numeric:tabular-nums}
#rival .rn{font-weight:700;color:var(--hot);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
#rival .rs{margin-left:auto}
#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 112px);background:var(--ink);color:var(--paper);font-weight:700;font-size:14px;padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;z-index:7}
#toast.show{opacity:1}
#ov{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;background:rgba(232,238,240,.93);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);padding-top:calc(env(safe-area-inset-top,0px) + 16px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));touch-action:pan-y}
.panel{width:100%;max-width:440px;max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch;padding:2px 6px 8px 2px}
h1,h2{font-family:var(--display);font-weight:400;margin:0;line-height:.92;text-wrap:balance}
h1{font-size:clamp(52px,17vw,92px);letter-spacing:-.02em}
h2{font-size:34px}
h3{font-family:var(--display);font-weight:400;font-size:20px;margin:4px 0 0;line-height:1}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--hot)}
p{margin:0;font-size:16px;line-height:1.45;color:var(--ink2);max-width:60ch}
.btn{border-radius:14px;padding:13px 16px;border:2px solid var(--ink);background:var(--paper);font-weight:700;font-size:16px}
.btn.pri{background:var(--ink);color:var(--paper);font-family:var(--display);font-weight:400;font-size:22px}
.btn:disabled{opacity:.4}
.btns{display:flex;gap:10px}.btns>*{flex:1;min-width:0}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{text-align:left;border:2px solid var(--ink);border-radius:16px;background:var(--sheet);padding:12px;display:flex;flex-direction:column;gap:4px;box-shadow:4px 4px 0 var(--ink);min-width:0}
.mode:active,.card:active,.hero:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.mode .nm{font-family:var(--display);font-size:20px;line-height:1}
.mode .ds{font-size:13.5px;color:var(--ink2);line-height:1.3}
.mode .tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--cobalt);margin-top:auto;padding-top:4px}
.mode.wide{grid-column:1/-1}
.mode.duel{background:var(--ink);color:var(--paper)}
.mode.duel .ds{color:#c3cad6}.mode.duel .tag{color:var(--hot)}
.hero{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-align:left;border:2px solid var(--ink);border-radius:16px;background:var(--sheet);padding:10px 12px;box-shadow:4px 4px 0 var(--ink)}
.dot{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);position:relative;flex:none;display:block}
.dot::after{content:"";position:absolute;inset:32%;border-radius:50%;background:#fff}
.hero .nm{font-family:var(--display);font-size:20px;line-height:1}
.hero .ds{font-size:13px;color:var(--ink2);line-height:1.3}
.coins{font-family:var(--display);font-size:18px;color:var(--gold);white-space:nowrap;font-variant-numeric:tabular-nums}
.prof{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:13px;font-weight:700;color:var(--ink2)}
.prof b{font-family:var(--display);font-weight:400;font-size:16px;color:var(--ink)}
.bar{height:8px;border:2px solid var(--ink);border-radius:6px;overflow:hidden;background:var(--sheet)}
.bar i{display:block;height:100%;background:var(--cobalt)}
.quests{display:grid;gap:6px;border:2px solid var(--ink);border-radius:14px;padding:10px 12px;background:var(--sheet)}
.q{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:14px;align-items:center}
.q .bar{grid-column:1/-1;height:6px;border-width:1.5px}
.q em{font-style:normal;font-weight:700;color:var(--gold);font-size:13px;font-variant-numeric:tabular-nums}
.q.done span{text-decoration:line-through;color:var(--ink2)}
.card{text-align:left;border-radius:16px;padding:14px 16px;border:2px solid var(--ink);background:var(--sheet);display:grid;grid-template-columns:44px 1fr;gap:4px 12px;align-items:center;box-shadow:4px 4px 0 var(--ink)}
.card.r1{box-shadow:4px 4px 0 var(--cobalt);border-color:var(--cobalt)}
.card.r2{box-shadow:4px 4px 0 var(--gold);border-color:var(--gold);background:#fff8e6}
.card .ic{grid-row:1/3;width:44px;height:44px;border-radius:50%;background:var(--cobalt);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:20px}
.card .nm{font-family:var(--display);font-size:20px;line-height:1.05}
.card .rar{font-family:var(--body);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-left:6px;vertical-align:middle}
.card.r1 .rar{color:var(--cobalt)}.card.r2 .rar{color:var(--gold)}
.card .ds{font-size:15px;color:var(--ink2);line-height:1.3}
.bro{border:2px solid var(--ink);border-radius:16px;background:var(--sheet);padding:12px;display:grid;grid-template-columns:46px 1fr;gap:6px 12px}
.bro.sel{box-shadow:0 0 0 3px var(--cobalt)}
.bro.lock .dot{filter:grayscale(1);opacity:.5}
.bro .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.bro .nm{font-family:var(--display);font-size:20px;line-height:1}
.bro .role{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--ink2)}
.bro .lv{margin-left:auto;font-family:var(--display);font-size:14px}
.bro .info{grid-column:1/-1;display:grid;gap:5px;font-size:14px;line-height:1.35;color:var(--ink2)}
.bro .info b{color:var(--ink)}
.bro .info .off{opacity:.55}
.bro .meta{font-size:12.5px;font-weight:600;color:var(--ink2)}
.bro .acts{grid-column:1/-1;display:flex;gap:8px}
.bro .acts button{flex:1;padding:10px;border-radius:12px;border:2px solid var(--ink);background:var(--paper);font-weight:700;font-size:14px}
.bro .acts button.gold{background:var(--ink);color:#ffd36b}
.bro .acts button:disabled{opacity:.4}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{border:2px solid var(--ink);border-radius:12px;padding:8px 10px;background:var(--sheet);min-width:0}
.stats span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--ink2)}
.stats b{display:block;font-family:var(--display);font-weight:400;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lvl{aspect-ratio:1;max-width:100%;border:2px solid var(--ink);border-radius:12px;background:var(--sheet);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--display);font-size:20px}
.lvl small{font-family:var(--body);font-size:11px;letter-spacing:.05em;color:var(--hot);font-weight:700}
.lvl:disabled{opacity:.35}
.lvl.next{background:var(--ink);color:var(--paper)}
.list{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.list li{display:grid;grid-template-columns:22px 1fr auto;gap:8px;font-size:15px;line-height:1.35;align-items:start}
.list li i{width:18px;height:18px;border-radius:50%;border:2px solid var(--steel);margin-top:1px}
.list li em{font-style:normal;font-weight:700;color:var(--gold);font-size:13px}
.list li.done i{background:var(--cobalt);border-color:var(--ink)}
.list li.done span{color:var(--ink2);text-decoration:line-through}
.field{display:grid;gap:4px}
.field label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--ink2)}
.field input{font:inherit;font-size:18px;font-weight:700;border:2px solid var(--ink);border-radius:12px;padding:11px 12px;background:var(--sheet);color:var(--ink);width:100%;min-width:0;-webkit-user-select:text;user-select:text}
.code{font-family:var(--display);font-size:56px;letter-spacing:.12em;line-height:1;color:var(--cobalt)}
.note{font-size:13.5px;color:var(--ink2);line-height:1.4;border-left:3px solid var(--hot);padding-left:10px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.vs b{display:block;font-family:var(--display);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums}
.vs span{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.vs em{font-style:normal;font-family:var(--display);color:var(--hot)}
.stars{font-family:var(--display);font-size:40px;letter-spacing:.1em;color:var(--hot)}
.stars s{color:var(--steel);text-decoration:none}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13.5px;color:var(--ink2)}
.legend b{color:var(--ink)}
.small{font-size:13px;color:var(--ink2)}
.hearts{align-items:center;max-width:150px}
.hrt{width:18px;height:17px;flex:none}
.hrt .bg{fill:rgba(255,255,255,.85)}.hrt .fg{fill:#ff5c7a}.hrt .ol{fill:none;stroke:var(--ink);stroke-width:2.2}.hrt.off .ol{stroke:var(--steel)}
.hearts.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.hplbl{font-size:9px;letter-spacing:.14em;font-weight:700;color:var(--ink2);margin-right:1px}
#tray{position:absolute;left:0;right:0;z-index:3;pointer-events:none;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
#tray .box{pointer-events:auto;background:rgba(246,249,250,.95);border:2px solid var(--ink);border-radius:14px;padding:8px;box-shadow:3px 3px 0 var(--ink);animation:trayIn .35s cubic-bezier(.2,1.4,.4,1)}
.trayhead{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.trayhead .grow{flex:1;min-width:0}
.trayhead button{border:2px solid var(--ink);border-radius:999px;background:#fff;font-weight:700;font-size:12px;padding:4px 10px;letter-spacing:0;text-transform:none;white-space:nowrap}
.trayhead button:disabled{opacity:.4}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;border:2px solid var(--ink);border-radius:10px;background:#fff;padding:6px 4px;min-width:0;animation:tileIn .38s both}
.tile:nth-child(2){animation-delay:.06s}.tile:nth-child(3){animation-delay:.12s}
.tile img,.tile .dot{width:40px;height:40px}
.tile b{font-size:12.5px;line-height:1.1}
.tile span{font-size:11px;color:var(--ink2);line-height:1.2}
.tile.r1{border-color:var(--cobalt)}.tile.r2{border-color:var(--gold);background:#fff8e6}
.tile.picked{animation:tileOut .3s forwards}
.chip{pointer-events:auto;border:2px solid var(--ink);border-radius:999px;background:var(--ink);color:#ffd36b;font-weight:700;font-size:13px;padding:6px 12px;box-shadow:2px 2px 0 var(--gold);animation:pulse 1.2s infinite}
@keyframes trayIn{from{transform:translateY(-14px) scale(.96);opacity:0}}
@keyframes tileIn{from{transform:scale(.5) rotate(-6deg);opacity:0}}
@keyframes tileOut{to{transform:scale(1.25);opacity:0}}
@keyframes pulse{50%{transform:scale(1.06)}}
.topbar{position:sticky;top:-2px;z-index:2;display:flex;align-items:center;gap:10px;background:rgba(232,238,240,.97);padding:6px 0 8px}
.topbar .back{border:2px solid var(--ink);border-radius:999px;background:var(--sheet);font-weight:700;font-size:14px;padding:7px 14px;white-space:nowrap}
.topbar .ttl{font-family:var(--display);font-size:20px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pimg{display:block;width:52px;height:52px}
.hero .pimg{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.bgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.bt{border:2px solid var(--ink);border-radius:12px;background:var(--sheet);padding:4px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:700;min-width:0;position:relative}
.bt img,.bt .dot{width:100%;max-width:52px;height:auto;aspect-ratio:1}
.bt.lock img{filter:grayscale(1);opacity:.45}
.bt.on{box-shadow:0 0 0 3px var(--cobalt)}
.bt.sel::after{content:"✓";position:absolute;top:2px;right:5px;font-size:12px;color:var(--cobalt)}
.bt small{font-size:10px;color:var(--ink2);font-weight:600}
.detail{border:2px solid var(--ink);border-radius:16px;background:var(--sheet);padding:12px;display:grid;gap:10px}
.dhead{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center}
.dhead img{width:84px;height:84px;animation:bob 2.4s ease-in-out infinite}
.sbars{display:grid;gap:4px;font-size:10.5px;font-weight:700;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase;margin-top:6px}
.sbar{display:grid;grid-template-columns:58px 1fr;gap:6px;align-items:center}
.sbar i{display:block;height:7px;border-radius:4px;background:var(--paper);border:1.5px solid var(--ink);overflow:hidden;position:relative}
.sbar i b{position:absolute;top:0;bottom:0;left:0}
.abil{display:grid;grid-template-columns:30px 1fr;gap:8px;font-size:14px;line-height:1.35;color:var(--ink2);align-items:start}
.abil .k{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:13px}
.abil b{color:var(--ink)}
.abil.off{opacity:.5}
.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.skin{border:2px solid var(--ink);border-radius:12px;background:#fff;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;min-width:0}
.skin img,.skin .dot{width:52px;height:52px}
.skin small{font-size:11px;color:var(--gold)}
.skin.on{box-shadow:0 0 0 3px var(--cobalt)}
.skin:disabled{opacity:.45}
.upgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.upgrid div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;text-align:center;line-height:1.1}
.upgrid img,.upgrid .dot{width:40px;height:40px}
@media (prefers-reduced-motion:reduce){#tray .box,.tile,.chip,.hero .pimg,.dhead img,.hearts.shake{animation:none!important}}

</style>

<div id="app">
  <canvas id="cv"></canvas>
  <header id="hud" hidden>
    <div class="hrow">
      <div class="hearts" id="hearts"></div>
      <div class="mid"><div id="score">0</div><div id="wave">Wave 1</div></div>
      <button id="pauseBtn" aria-label="Pause">II</button>
    </div>
    <div id="rival" hidden><span class="rn" id="rivalName">Rival</span><span id="rivalHp"></span><span class="rs" id="rivalScore">0</span></div>
  </header>
  <div id="tray" hidden></div>
  <div id="toast"></div>
  <div id="ov"></div>
  <div id="sab" style="position:fixed;left:0;bottom:0;width:1px;height:env(safe-area-inset-bottom,0px);pointer-events:none"></div>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d'),hud=$('#hud'),ov=$('#ov');
const TAU=Math.PI*2,rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const INK='#191b24',COB='#2346ff',HOT='#ff6a2b',STEEL='#8a93a6',PAPER='#e8eef0',GOLD='#c98a00',HEAL='#2fa36b';
let W,H,DPR,u,AX,AY,AW,AH,splat,sctx,T=0;
const store={get(k,d){try{const v=localStorage.getItem('ib_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('ib_'+k,JSON.stringify(v))}catch(e){}}};
let best=store.get('best',{score:0,wave:0}),tutDone=store.get('tut',false),rushBest=store.get('rush',0);
let mazeSave=store.get('maze',{top:0,stars:{}});
let missionsDone=store.get('missions',{}),myName=store.get('name','');
let coins=store.get('coins',0),brLevels=store.get('br',{kite:1}),selBr=store.get('sel','kite');
let prof=store.get('prof',{xp:0,lv:1}),muted=store.get('mute',false);
if(!brLevels.kite)brLevels.kite=1;
let PC=COB;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let srand=Math.random;const srnd=(a,b)=>a+srand()*(b-a);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const addCoins=n=>{coins+=n;store.set('coins',coins)};

/* ---------- sound ---------- */
let AC=null,noiseBuf=null,lastKill=0;
function audioInit(){if(AC||muted)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();const n=Math.floor(AC.sampleRate*.5);noiseBuf=AC.createBuffer(1,n,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1}catch(e){AC=null}}
function tone(f,dur,type,vol,slide,delay){const a=AC;if(!a)return;const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);g.gain.setValueAtTime(vol||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.03)}
function noise(dur,vol,freq,delay){const a=AC;if(!a||!noiseBuf)return;const t=a.currentTime+(delay||0),s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=noiseBuf;f.type='bandpass';f.frequency.value=freq||1200;g.gain.setValueAtTime(vol||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+dur+.03)}
function sfx(k,v){if(muted||!AC)return;try{if(AC.state==='suspended')AC.resume();const V=VOICE,f=V.f;switch(k){
 case 'dash':noise(.16,.09,(700+(v||.5)*1100)*Math.sqrt(f));tone(200*f,.1,V.w,.04,420*f);break;
 case 'kill':{const n=performance.now();if(n-lastKill<45)return;lastKill=n;const c=Math.min(20,v||1),q=Math.pow(f,.4);tone((260+c*35)*q,.11,'triangle',.11,(520+c*55)*q);break}
 case 'hit':tone(170,.09,'square',.06,90);break;
 case 'hurt':tone(150,.32,'sawtooth',.13,50);noise(.18,.12,400);break;
 case 'super':tone(260*f,.35,V.w,.1,780*f);tone(390*f,.4,'sine',.08,1040*f,.05);tone(520*f,.3,'triangle',.06,1300*f,.1);break;
 case 'hyper':tone(180*f,.5,'sawtooth',.09,900*f);tone(360*f,.5,V.w,.09,1440*f,.08);noise(.3,.12,2500);break;
 case 'gadget':tone(560*f,.1,V.w,.06,1000*f);tone(840*f,.08,'sine',.05,0,.07);break;
 case 'coin':tone(1250,.07,'sine',.07);tone(1700,.09,'sine',.07,0,.06);break;
 case 'crate':noise(.12,.16,480);break;
 case 'bounce':tone(520*f,.05,'sine',.05,700*f);break;
 case 'boss':tone(70,.9,'sawtooth',.13,35);break;
 case 'wave':tone(523,.12,'triangle',.09);tone(784,.18,'triangle',.09,0,.11);break;
 case 'zap':noise(.07,.07,3200);break;
 case 'boom':noise(.32,.2,220);tone(95,.28,'sine',.13,40);break;
 case 'block':tone(950,.05,'square',.05,600);break;
 case 'graze':tone(1500,.06,'sine',.05,2200);break;
 case 'laser':tone(1800,.08,'sawtooth',.03,900);break;
 case 'level':tone(523,.1,'triangle',.1);tone(659,.1,'triangle',.1,0,.1);tone(784,.2,'triangle',.1,0,.2);break;
 case 'pick':[523,659,784,1046].forEach((q,i)=>tone(q*Math.pow(f,.25),.12,'triangle',.08,0,i*.05));break;
 case 'reroll':noise(.2,.1,1800);tone(400,.15,'sine',.05,900);break;
 case 'offer':tone(880,.08,'sine',.06);tone(1175,.12,'sine',.06,0,.07);break;
 case 'thud':tone(110,.18,'sine',.14,50);noise(.1,.1,300);break;
 case 'heal':tone(700,.1,'sine',.05,1100);break;
 case 'spawn':tone(300,.08,'square',.03,500);break;
 case 'snipe':tone(2400,.1,'sawtooth',.05,600);break;
 case 'mine':tone(900,.05,'square',.04);break;
}}catch(e){}}

const QP=[['kills','Defeat {n} enemies',[60,100,150]],['supers','Use your Super {n} times',[3,5,8]],['gadgets','Use a Gadget {n} times',[3,6]],['crates','Smash {n} crates',[10,20]],['waves','Clear {n} waves in Survival or Daily',[8,15]],['mazes','Finish {n} maze levels',[2,4]],['bosses','Defeat {n} bosses',[1,2]],['close','Get {n} close calls',[10,25]],['multi','Kill 3+ enemies in one dash {n} times',[3,6]]];
const dayKey=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function dailyInfo(){const k=dayKey();let h=2166136261;for(const c of k)h=Math.imul(h^c.charCodeAt(0),16777619)>>>0;return{key:k,seed:h,mod:DAILY[h%DAILY.length]}}
let QQ=null;
function questsToday(){const d=dailyInfo();if(QQ&&QQ.key===d.key)return QQ;let q=store.get('quests',null);
  if(!q||q.key!==d.key){const r=mulberry(d.seed^0x5bd1);const pool=QP.slice(),list=[];for(let i=0;i<3;i++){const p=pool.splice(Math.floor(r()*pool.length),1)[0],tier=Math.floor(r()*p[2].length);const nn=p[2][tier];let tx=p[1].replace('{n}',nn);if(nn===1)tx=tx.replace('bosses','boss').replace('levels','level').replace('times','time');list.push({id:p[0],n:nn,txt:tx,prog:0,done:false,coins:30+tier*20})}q={key:d.key,list};store.set('quests',q)}
  QQ=q;return q}
function quest(id,amt){const q=questsToday();let ch=false;for(const x of q.list)if(x.id===id&&!x.done){x.prog=Math.min(x.n,x.prog+(amt||1));ch=true;if(x.prog>=x.n){x.done=true;addCoins(x.coins);toast('Quest done: '+x.txt+' · +'+x.coins+' coins');sfx('coin')}}if(ch)store.set('quests',q)}
const xpNeed=lv=>400+lv*200;
function addXP(n){prof.xp+=Math.max(0,Math.round(n));let ups=0,c=0;while(prof.xp>=xpNeed(prof.lv)){prof.xp-=xpNeed(prof.lv);prof.lv++;ups++;const g=15+prof.lv*5;c+=g;addCoins(g)}store.set('prof',prof);if(ups){setTimeout(()=>{toast('Player level '+prof.lv+' · +'+c+' coins');sfx('level')},900)}return ups}

function genLayout(ew,boss){

    if(Math.hypot(x+wd/2-S.p.x,y+ht/2-S.p.y)<16+Math.max(wd,ht)/2)continue;
    if(boss&&Math.hypot(x+wd/2-AW/2,y+ht/2-AH*.33)<24)continue;
    if(rects.some(r=>x<r.x+r.w+7&&x+wd+7>r.x&&y<r.y+r.h+7&&y+ht+7>r.y))continue;
    rects.push({x,y,w:wd,h:ht});fn(x,y);return true}return false};
  for(let i=0;i<(boss?3:2+Math.floor(ew/3))*m;i++)place(7,7,(x,y)=>S.walls.push({x,y,w:7,h:7,crate:true}));

function genMaze(level){

  const V=[...Array(rows)].map(()=>Array(cols+1).fill(true)),Hh=[...Array(rows+1)].map(()=>Array(cols).fill(true)),seen=[...Array(rows)].map(()=>Array(cols).fill(false));
  const stack=[[rows-1,0]];seen[rows-1][0]=true;
  while(stack.length){const [r,c]=stack[stack.length-1],nb=[];
    if(r>0&&!seen[r-1][c])nb.push([r-1,c,'u']);if(r<rows-1&&!seen[r+1][c])nb.push([r+1,c,'d']);if(c>0&&!seen[r][c-1])nb.push([r,c-1,'l']);if(c<cols-1&&!seen[r][c+1])nb.push([r,c+1,'r']);
    if(!nb.length){stack.pop();continue}
    const [nr,nc,d]=nb[Math.floor(srand()*nb.length)];
    if(d==='u')Hh[r][c]=false;if(d==='d')Hh[r+1][c]=false;if(d==='l')V[r][c]=false;if(d==='r')V[r][c+1]=false;
    seen[nr][nc]=true;stack.push([nr,nc])}
  let extra=Math.round(rows*cols*.16);
  while(extra-->0){if(srand()<.5){Hh[1+Math.floor(srand()*(rows-1))][Math.floor(srand()*cols)]=false}else{V[Math.floor(srand()*rows)][1+Math.floor(srand()*(cols-1))]=false}}
  const TH=2.2,walls=[];
  for(let r=1;r<rows;r++)for(let c=0;c<cols;c++)if(Hh[r][c])walls.push({x:c*cw-TH/2,y:r*ch-TH/2,w:cw+TH,h:TH});
  for(let r=0;r<rows;r++)for(let c=1;c<cols;c++)if(V[r][c])walls.push({x:c*cw-TH/2,y:r*ch-TH/2,w:TH,h:ch+TH});
  return{cols,rows,cw,ch,walls};
}
function cellC(r,c){return{x:(c+.5)*S.maze.cw,y:(r+.5)*S.maze.ch}}

const fmtT=t=>{t=Math.max(0,Math.round(t));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};

/* ---------- physics ---------- */
const LETHAL=55,DECAY=3;
function overlapRect(o,r,w){const cx=clamp(o.x,w.x,w.x+w.w),cy=clamp(o.y,w.y,w.y+w.h);return Math.hypot(o.x-cx,o.y-cy)<r}
function circleRect(o,r,w,bounce){
  const cx=clamp(o.x,w.x,w.x+w.w),cy=clamp(o.y,w.y,w.y+w.h);let dx=o.x-cx,dy=o.y-cy,d=Math.hypot(dx,dy);

    if(m===l){nx=-1;ny=0;px=w.x;py=o.y}else if(m===rr){nx=1;ny=0;px=w.x+w.w;py=o.y}else if(m===t){nx=0;ny=-1;px=o.x;py=w.y}else{nx=0;ny=1;px=o.x;py=w.y+w.h}}

function stepBody(o,dt,r,onWall){
  const sp=Math.hypot(o.vx,o.vy),n=Math.max(1,Math.ceil(sp*dt/1.2)),h=dt/n;let hit=false;
  for(let i=0;i<n;i++){
    o.x+=o.vx*h;o.y+=o.vy*h;let w=false;
    if(o.x<r){o.x=r;o.vx=Math.abs(o.vx);w=true}if(o.x>AW-r){o.x=AW-r;o.vx=-Math.abs(o.vx);w=true}
    if(o.y<r){o.y=r;o.vy=Math.abs(o.vy);w=true}if(o.y>AH-r){o.y=AH-r;o.vy=-Math.abs(o.vy);w=true}
    for(const wl of S.walls){
      if(wl.dead)continue;
      if(wl.crate&&o.breaker){if(o===S.p&&overlapRect(o,r,wl))breakCrate(wl,true);continue}
      if(circleRect(o,r,wl,true))w=true;
    }

function segDist(px,py,ax,ay,bx,by){const vx=bx-ax,vy=by-ay,l=vx*vx+vy*vy||1,t=clamp(((px-ax)*vx+(py-ay)*vy)/l,0,1);return Math.hypot(px-ax-vx*t,py-ay-vy*t)}

function rayEnd(x,y,a,len){const c=Math.cos(a),s=Math.sin(a);for(let d=1.5;d<len;d+=1.5){const px=x+c*d,py=y+s*d;if(px<0||py<0||px>AW||py>AH||wallAt(px,py))return[px,py]}return[x+c*len,y+s*len]}

  S.score+=25*S.ptsMul;S.shake=Math.max(S.shake,.08);

function doDash(dx,dy,pow){

  if(S.charges<1){S.texts.push({x:S.p.x,y:S.p.y-7,s:'No charge',c:HOT,life:.7});sfx('block');return}
  S.charges--;const v=dashVel(pow),n=Math.hypot(dx,dy)||1;
  const sx0=S.p.x,sy0=S.p.y;S.p.vx=dx/n*v;S.p.vy=dy/n*v;S.p.bounce=0;S.p.dashKills=0;S.p.lethal=true;S.dashes++;S.p.ricos=0;S.dashCount++;
  if(S.br.id==='echo')S.echoQ.push({t:.35,x:sx0,y:sy0,vx:S.p.vx,vy:S.p.vy});
  if(S.br.id==='bastion'&&S.dashCount%3===0){if(S.mines.length>=4)S.mines.shift();S.mines.push({x:sx0,y:sy0,t:20});sfx('mine')}
  sfx('dash',pow);
  for(let i=0;i<6;i++)S.parts.push({x:S.p.x,y:S.p.y,vx:-dx/n*rnd(20,60)+rnd(-15,15),vy:-dy/n*rnd(20,60)+rnd(-15,15),life:.3,max:.3,c:PC,sz:1});
  if(P.inkstorm&&S.dashCount%4===0){for(let i=0;i<6;i++){const a=i/6*TAU;S.bullets.push({x:S.p.x,y:S.p.y,vx:Math.cos(a)*110,vy:Math.sin(a)*110,r:1.8,life:1.2,friendly:true,dmg:1,pierce:1,hit:[]})}}
}
function inPool(x,y){for(const h of S.haz)if(h.k==='pool'&&Math.hypot(x-h.x,y-h.y)<h.r)return true;return false}
function sawPos(h){const k=(Math.sin(S.time*h.spd*2+h.ph)+1)/2;return{x:h.x1+(h.x2-h.x1)*k,y:h.y1+(h.y2-h.y1)*k}}
function updPlayer(dt){
  const p=S.p;p.breaker=p.lethal;

/* ---------- main update ---------- */
function update(rdt){
  if(S.count>0){S.count-=rdt;if(S.count<=0){S.banner={t:'Go!',s:'',life:.8};sfx('wave')}fx(rdt);return}
  if(S.hs>0){S.hs-=rdt;fx(rdt);return}
  let scale=S.mod==='quick'?1.25:1;
  if(aim&&S.focus>0){scale*=.2;S.focus-=rdt}else S.focus=Math.min(P.focusMax,S.focus+rdt*.22);
  if(S.slow>0){S.slow-=rdt;scale=Math.min(scale,.35)}
  const dt=rdt*scale,edt=dt*(S.qsT>0?.3:1);
  S.time+=dt;
  if(S.inter>0){S.inter-=dt;if(S.inter<=0){S.inter=0;S.wave++;startWave();if(S.offer&&S.trayOpen){S.trayOpen=false;renderTray()}}}
  if(S.gadCd>0)S.gadCd-=rdt;if(S.ironT>0)S.ironT-=dt;if(S.qsT>0)S.qsT-=rdt;if(S.phaseT>0)S.phaseT-=dt;if(S.flash>0)S.flash-=rdt;
  let wd=false;for(const w of S.walls)if(w.temp){w.temp-=dt;if(w.temp<=0){w.dead=true;wd=true}}if(wd)S.walls=S.walls.filter(w=>!w.dead);
  for(const t of S.tele){t.t-=edt;if(t.t<=0){addEnemy(t.type,t.x,t.y,{rival:t.rival});t.done=true}}
  S.tele=S.tele.filter(t=>!t.done);
  if(S.kind!=='maze')spawnTick(edt);
  if(S.incoming>0){S.inT-=dt;if(S.inT<=0){S.incoming--;S.inT=.18;const pos=farSpot(26);S.tele.push({type:Math.random()<.6?'darter':'grunt',x:pos.x,y:pos.y,t:.9,rival:true})}}
  updPlayer(dt);if(mode==='card')return;
  updSupers(dt);updEnemies(edt);updBullets(dt,edt);updBombs(edt);
  for(const h of S.haz)if(h.hit>0)h.hit-=dt;
  for(const t of S.trail)t.life-=dt;S.trail=S.trail.filter(t=>t.life>0);
  for(const t of S.vtrail)t.life-=dt;S.vtrail=S.vtrail.filter(t=>t.life>0);
  if(S.chainT>0){S.chainT-=dt;if(S.chainT<=0)S.chain=0}
  fx(dt);
  if(S.banner&&S.banner.life<90){S.banner.life-=rdt;if(S.banner.life<=0)S.banner=null}
  if(mode==='play'&&S.kind!=='maze'&&!S.inter&&!S.queue.length&&!S.tele.length&&!S.enemies.length&&!S.bombs.length&&!S.incoming)waveClear();
}

  for(const r of S.rings)r.life-=dt;S.rings=S.rings.filter(r=>r.life>0);
  for(const t of S.texts){t.y-=10*dt;t.life-=dt}S.texts=S.texts.filter(t=>t.life>0);

/* ---------- input ---------- */
cv.addEventListener('pointerdown',ev=>{
  audioInit();
  if(mode!=='play'||!S)return;try{cv.setPointerCapture(ev.pointerId)}catch(e){}
  const r=cv.getBoundingClientRect(),px=ev.clientX-r.left,py=ev.clientY-r.top;
  const b=superBtn(),g=gadBtn();
  if(Math.hypot(px-b.x,py-b.y)<b.r+10){
    if(S.super>=1)aim={id:ev.pointerId,sx:ev.clientX,sy:ev.clientY,cx:ev.clientX,cy:ev.clientY,sup:true};
    else S.texts.push({x:S.p.x,y:S.p.y-9,s:'Super '+Math.floor(S.super*100)+'%',c:STEEL,life:.7});
    return;
  }
  if(Math.hypot(px-g.x,py-g.y)<g.r+8){fireGadget();return}
  aim={id:ev.pointerId,sx:ev.clientX,sy:ev.clientY,cx:ev.clientX,cy:ev.clientY};
});
cv.addEventListener('pointermove',ev=>{if(aim&&ev.pointerId===aim.id){aim.cx=ev.clientX;aim.cy=ev.clientY}});
cv.addEventListener('pointerup',ev=>{if(!aim||ev.pointerId!==aim.id)return;const a=aimVec(),wasSup=aim.sup;aim=null;if(mode!=='play')return;if(wasSup)fireSuper(a);else if(a)doDash(a.dx,a.dy,a.pow)});
cv.addEventListener('pointercancel',()=>{aim=null});
$('#pauseBtn').onclick=()=>{if(mode==='play')pause()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play'&&S.kind!=='duel')pause()});

  netPresence({st:'play',m:go,sent:0,sc:0,hp:3,wv:1});
  newRun('duel',{seed,countdown:3});
  $('#rivalName').textContent=cleanName(duel.rival&&duel.rival.presence.nm)||'Rival';
}
function sendAttack(n){if(!duel||duel.st!=='play')return;duel.sent+=n;netPresence({sent:duel.sent});S.texts.push({x:S.p.x,y:S.p.y-14,s:'Sent '+n+' →',c:HOT,life:1})}
function netTick(dt){
  if(!duel||duel.st!=='play'||!S||S.kind!=='duel')return;
  S.netT-=dt;if(S.netT>0)return;S.netT=.25;
  netPresence({sc:S.score,hp:Math.ceil(S.hearts),wv:S.wave,st:S.hearts>0?'play':'dead',m:duel.go});
  const rp=duel.rival&&duel.rival.presence;
  if(rp&&rp.m===duel.go){$('#rivalScore').textContent=(rp.sc|0).toLocaleString()+' · W'+(rp.wv|0);$('#rivalHp').textContent='♥'.repeat(clamp(rp.hp|0,0,7))}
  else{$('#rivalScore').textContent='connecting…';$('#rivalHp').textContent=''}
}
function duelWon(why){
  if(!duel||duel.st!=='play')return;duel.st='done';duel.result={win:true,why,my:S.score,coins:bankRun()+25};addCoins(25);mission('duel');sfx('level');
  mode='over';aim=null;netPresence({st:'won',sc:S.score});renderResult();
}
function duelLost(){
  if(!duel){menu();return}
  duel.st='done';duel.result={win:false,why:'You ran out of hearts.',my:S.score,coins:bankRun()};
  mode='over';aim=null;netPresence({st:'dead',sc:S.score,hp:0});renderResult();
}
function renderResult(){$('#tray').hidden=true;
  const r=duel.result,rp=duel.rival&&duel.rival.presence;
  showOv(`<div class="eyebrow">Duel ${duel.code} · <span style="color:var(--gold)">+${r.coins} coins</span></div><h2>${r.win?'You win':'You lost'}</h2><p>${esc(r.why)}</p>
   <div class="vs"><div><span>${esc(myName)}</span><b>${r.my.toLocaleString()}</b></div><em>vs</em><div><span>${esc(rp?cleanName(rp.nm):'Rival')}</span><b>${rp?(rp.sc|0).toLocaleString():'—'}</b></div></div>
   <button class="btn pri" data-act="again">Rematch</button><button class="btn" data-act="leave">Leave</button>`,
  a=>{if(a==='again'){duel.st='lobby';netPresence({st:'lobby',sent:0,m:0});S=null;hud.hidden=true;layout();lobby()}if(a==='leave'){leaveDuel();menu()}});
}

/* ---------- HUD + loop ---------- */
let lastHud='';
function updHud(){
  if(!S||hud.hidden)return;
  const k=S.hearts+'|'+P.maxHearts+'|'+S.score+'|'+S.wave+'|'+(S.kind==='maze'?Math.floor(S.time)+'|'+S.seals.filter(s=>s.got).length:'');if(k===lastHud)return;lastHud=k;
  let h='<span class="hplbl">HP</span>';for(let i=0;i<P.maxHearts;i++){const f=clamp(S.hearts-i,0,1);h+=`<svg class="hrt${f>0?'':' off'}" viewBox="0 0 24 22" aria-hidden="true"><defs><clipPath id="hc${i}"><rect width="${(24*f).toFixed(1)}" height="22"/></clipPath></defs><path class="bg" d="M12 21s-8.5-5.3-10.4-10.3C.3 7 2.6 3.5 6.4 3.5c2.4 0 4.2 1.3 5.6 3.2 1.4-1.9 3.2-3.2 5.6-3.2 3.8 0 6.1 3.5 4.8 7.2C20.5 15.7 12 21 12 21z"/><path class="fg" clip-path="url(#hc${i})" d="M12 21s-8.5-5.3-10.4-10.3C.3 7 2.6 3.5 6.4 3.5c2.4 0 4.2 1.3 5.6 3.2 1.4-1.9 3.2-3.2 5.6-3.2 3.8 0 6.1 3.5 4.8 7.2C20.5 15.7 12 21 12 21z"/><path class="ol" d="M12 21s-8.5-5.3-10.4-10.3C.3 7 2.6 3.5 6.4 3.5c2.4 0 4.2 1.3 5.6 3.2 1.4-1.9 3.2-3.2 5.6-3.2 3.8 0 6.1 3.5 4.8 7.2C20.5 15.7 12 21 12 21z"/></svg>`}$('#hearts').innerHTML=h;$('#hearts').setAttribute('aria-label',(Math.round(S.hearts*3)/3)+' of '+P.maxHearts+' hearts');
  $('#score').textContent=S.score.toLocaleString();
  $('#wave').textContent=S.kind==='maze'?'Maze '+S.level+' · '+fmtT(S.time)+' / par '+fmtT(S.par)+' · seals '+S.seals.filter(s=>s.got).length+'/3':S.wave===0?'Training':S.br.n+' · '+(S.kind==='daily'?'Daily · ':S.kind==='duel'?'Duel · ':'')+(S.kind==='rush'?'Boss Rush '+S.wave:'Wave '+S.wave);
}
let last=performance.now();
function frame(now){
  const rdt=Math.min(.05,(now-last)/1000);last=now;T+=rdt;
  if(S&&(mode==='play'||mode==='dying'))update(rdt);
  else if(S&&mode==='card')fx(rdt);
  if(S&&S.kind==='duel')netTick(rdt);
  draw();updHud();requestAnimationFrame(frame);
}
layout();menu();requestAnimationFrame(frame);
getRoom();
})();
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
